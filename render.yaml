services:
  - type: web
    name: sumolab-ai
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_DECISIONS_PER_HOUR
        value: '250'
      - key: MAX_DECISIONS_PER_DAY
        value: '800'
      - key: MOCK_LLM
        value: '0'
